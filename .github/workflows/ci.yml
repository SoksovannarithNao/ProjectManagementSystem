name: CI

# Runs on every Pull Request targeting dev or main.
# Covers PRs from ANY feature branch automatically (frontend/*, backend/*, api/*, database/*)
# because the filter matches the PR's target branch, not its source.
on:
  pull_request:
    branches: [dev, main]

    
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend # adjust if your React app lives elsewhere

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
            node-version: 20
            cache: npm
            cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend # adjust if your Spring Boot app lives elsewhere

    # Throwaway Postgres just for this job's tests — not your real database.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: taskmanager_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # Service containers start before checkout, so the schema can't be mounted into
      # /docker-entrypoint-initdb.d like docker-compose.yml does locally — load it here
      # instead, once the repo is actually on disk and Postgres is healthy.
      - name: Load database schema
        env:
          PGPASSWORD: postgres
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          for f in "${{ github.workspace }}"/database/init/*.sql; do
            psql -h localhost -U postgres -d taskmanager_test -f "$f"
          done

      # The init scripts hold the end state of every migration up to the baseline in
      # 04-flyway-baseline.sql, so Flyway has nothing left to apply to the database just loaded. A
      # migration that was not folded into 01-init.sql would be applied here: the step fails, because
      # a fresh volume would not have it. (A database cannot be built from the migrations alone: issue X-04.)
      - name: Check the migrations are folded into the init scripts
        run: >-
          bash "${{ github.workspace }}/database/check_migrations_folded.sh"
          jdbc:postgresql://localhost:5432/taskmanager_test postgres postgres

      # database/verify_invariants.sql is a set of queries each expected to
      # return zero rows. -t -A (tuples-only, unaligned) suppresses headers
      # and row-count footers, so it prints nothing at all when every query
      # is empty — any output at all means a real invariant violation.
      - name: Verify database invariants
        env:
          PGPASSWORD: postgres
        run: |
          output=$(psql -h localhost -U postgres -d taskmanager_test -t -A -f "${{ github.workspace }}/database/verify_invariants.sql")
          if [ -n "$output" ]; then
            echo "::error::Database invariant check failed — one or more queries in database/verify_invariants.sql returned rows:"
            echo "$output"
            exit 1
          fi
          echo "All database invariants hold."

      # Runs the very script the Compose stack runs (database/init/03-app-role.sh), so the role
      # this job tests with is the role the application uses and its grants live in one place.
      # The script takes its connection from the postgres image's variables; psql reads the
      # host and password from PGHOST / PGPASSWORD.
      - name: Create least-privilege app role
        env:
          PGHOST: localhost
          PGPASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: taskmanager_test
          TASKMANAGER_APP_PASSWORD: taskmanager_app_password
        run: bash "${{ github.workspace }}/database/init/03-app-role.sh"

      # database/verify_grants.sql lists every table the app role cannot read, apart from the few
      # that deliberately have no entity. Any output means a new table was added without a GRANT
      # in 03-app-role.sh, which would otherwise surface as a 500 at run time.
      - name: Verify the app role can read every table
        env:
          PGPASSWORD: postgres
        run: |
          output=$(psql -h localhost -U postgres -d taskmanager_test -t -A -f "${{ github.workspace }}/database/verify_grants.sql")
          if [ -n "$output" ]; then
            echo "::error::These tables have no GRANT for taskmanager_app - add one to database/init/03-app-role.sh (or list the table in database/verify_grants.sql if the backend must not touch it):"
            echo "$output"
            exit 1
          fi
          echo "The app role can read every table."

      - name: Build & test
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/taskmanager_test
          SPRING_DATASOURCE_USERNAME: taskmanager_app
          SPRING_DATASOURCE_PASSWORD: taskmanager_app_password
        run: mvn -B verify

  # Browser tests against the real, whole application: the compose stack is built
  # from this checkout (database + Flyway + backend + frontend + Mailpit) and
  # Playwright drives it like a user would. A fresh runner means an empty database,
  # so database/init/*.sql seeds it exactly as a first local `docker compose up` does.
  e2e:
    runs-on: ubuntu-latest
    needs: [frontend, backend] # no point booting the stack if lint/unit tests failed
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # docker-compose.yml bind-mounts ./backend/logs, and the backend runs as an
      # unprivileged user inside the container. On a Linux runner the folder belongs
      # to the runner's user, so without this the backend cannot open its log file
      # and never becomes healthy.
      - name: Let the backend container write its logs
        run: chmod a+rwx backend/logs

      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Install Playwright browser
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

      - name: Show service logs
        if: failure()
        run: docker compose logs --no-color --tail=200

  docker-build-check:
    runs-on: ubuntu-latest
    needs: [frontend, backend] # only runs if both jobs above passed
    steps:
      - uses: actions/checkout@v4

      - name: Confirm frontend image builds
        run: docker build -t frontend-check ./frontend

      - name: Confirm backend image builds
        run: docker build -t backend-check ./backend
