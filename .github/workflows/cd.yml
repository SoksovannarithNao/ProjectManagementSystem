name: CD

# Runs only on push (i.e. after a merge lands) to dev or main.
# Never fires on raw feature-branch pushes — only once a PR is actually merged.
on:
  push:
    branches: [dev, main]

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # needed to push images to GitHub Container Registry

    steps:
      - uses: actions/checkout@v4

      # main -> tagged "latest" (your stable/demo build)
      # dev  -> tagged "dev"    (your integration/staging build)
      #
      # GHCR/OCI repository names must be all-lowercase, but github.repository
      # preserves the owner/repo casing as configured on GitHub, so it is
      # lowercased here rather than used directly in the image tag.
      - name: Set image tag and namespace
        id: vars
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "tag=dev" >> "$GITHUB_OUTPUT"
          fi
          echo "namespace=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # auto-provided by GitHub, no setup needed

      - name: Build & push frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.vars.outputs.namespace }}/frontend:${{ steps.vars.outputs.tag }}

      - name: Build & push backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.vars.outputs.namespace }}/backend:${{ steps.vars.outputs.tag }}

      # --- Optional deploy step ---
      # Add this once you decide where the demo actually runs (a VM you SSH into,
      # a free-tier host, or just `docker-compose pull && up` locally on demo day).
      # Example if you have a server reachable over SSH:
      #
      # - name: Deploy over SSH
      #   uses: appleboy/ssh-action@v1
      #   with:
      #     host: ${{ secrets.DEPLOY_HOST }}
      #     username: ${{ secrets.DEPLOY_USER }}
      #     key: ${{ secrets.DEPLOY_SSH_KEY }}
      #     script: |
      #       cd /opt/task-manager
      #       docker compose pull
      #       docker compose up -d
