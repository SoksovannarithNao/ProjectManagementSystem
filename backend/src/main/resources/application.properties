spring.application.name=backend

# Local default matches docker-compose.yml / .env.example. Overridden in CI via
# SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD
# (see .github/workflows/ci.yml). Connects as the least-privileged app role
# (database/init/03-app-role.sh), not the postgres superuser.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/taskmanager}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:taskmanager_app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:taskmanager_app_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Schema is owned by database/init/01-init.sql, not Hibernate — keep it read-only here.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT configuration
app.jwt.secret=${JWT_SECRET:change-this-development-secret-key-change-this-development-secret-key}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Mail — defaults to the local Mailpit container in docker-compose.yml (an
# SMTP catcher with no auth needed, nothing actually leaves the machine).
# Point these at a real provider via env vars for anything beyond local dev.
spring.mail.host=${MAIL_HOST:mailpit}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
app.mail.from=${MAIL_FROM:no-reply@taskflow.dev}

# Registration OTP
app.otp.expiration-minutes=${OTP_EXPIRATION_MINUTES:10}
app.otp.max-attempts=${OTP_MAX_ATTEMPTS:5}
app.otp.resend-cooldown-seconds=${OTP_RESEND_COOLDOWN_SECONDS:60}

# CORS — comma-separated list of allowed origins. Defaults cover the Vite
# dev server and the docker-compose frontend port (see .env.example).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:80}

# Defaults to INFO; a developer debugging JWT/role handling locally can
# export SECURITY_LOG_LEVEL=DEBUG without affecting anyone else.
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:INFO}

# File logging — mirrors console output to a rotating log file so errors and
# security/business events (see GlobalExceptionHandler) can be reviewed after
# the fact instead of only being visible in a live console.
logging.file.name=logs/log.txt
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=14
logging.logback.rollingpolicy.total-size-cap=100MB