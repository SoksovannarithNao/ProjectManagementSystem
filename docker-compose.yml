services:
  postgres:
    image: postgres:18-alpine
    container_name: taskmanager-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-taskmanager}
      # Read by database/init/03-app-role.sh to create the backend's own
      # least-privileged login (the backend never connects as POSTGRES_USER).
      TASKMANAGER_APP_PASSWORD: ${TASKMANAGER_APP_PASSWORD:-taskmanager_app_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-taskmanager}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Local SMTP catcher for registration OTP emails — nothing actually leaves
  # the machine. Swap in a real provider by overriding MAIL_HOST/MAIL_PORT/
  # MAIL_USERNAME/MAIL_PASSWORD (and MAIL_SMTP_AUTH/MAIL_SMTP_STARTTLS) via
  # .env, no code change needed. Web UI at http://localhost:8025 to view
  # "sent" mail; API at :8025/api/v1 for the same.
  mailpit:
    image: axllent/mailpit:latest
    container_name: taskmanager-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8025/livez || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: taskmanager-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-taskmanager}
      # Connects as the least-privileged app role (database/init/03-app-role.sh),
      # not the postgres superuser used above only for container init.
      SPRING_DATASOURCE_USERNAME: taskmanager_app
      SPRING_DATASOURCE_PASSWORD: ${TASKMANAGER_APP_PASSWORD:-taskmanager_app_password}
      JWT_SECRET: ${JWT_SECRET:-change-this-development-secret-key-change-this-development-secret-key}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:80}
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-false}
      MAIL_FROM: ${MAIL_FROM:-no-reply@taskflow.dev}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - ./backend/logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    container_name: taskmanager-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
