server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Reverse proxy to the backend service (Docker Compose service name).
    location /api/ {
        # Uploads (attachments up to 10 MB, profile photos up to 5 MB) pass through
        # here; nginx's default of 1 MB would refuse them before the backend
        # sees them. The backend enforces the real limits.
        client_max_body_size 12m;
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The address nginx sees, not an appended chain: a client cannot send its own
        # X-Forwarded-For to pose as another address (the backend's login limiter keys on it).
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # React Router: let the app handle unknown paths client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
